name: Verify

on:
  push:
  pull_request:

# Opt into Node 24 for JavaScript actions (e.g. actions/checkout) until Node 24 is the runner default.
# See https://docs.github.com/en/actions/reference/workflows-and-actions/metadata-syntax#runs-for-javascript-actions
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  agent-docs:
    name: Agent docs — frontmatter and routing paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: paths
        with:
          filters: |
            docs:
              - 'docs/**'
              - 'scripts/check-agent-docs.ts'

      - uses: pnpm/action-setup@v4
        if: steps.paths.outputs.docs == 'true'

      - uses: actions/setup-node@v4
        if: steps.paths.outputs.docs == 'true'
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        if: steps.paths.outputs.docs == 'true'
        run: pnpm install --frozen-lockfile

      - name: Verify agent-oriented docs
        if: steps.paths.outputs.docs == 'true'
        run: pnpm check:agent-docs

  knowledge-unit:
    name: Knowledge lib — unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: paths
        with:
          filters: |
            knowledge:
              - 'libs/knowledge/**'
              - 'apps/knowledge-api/**'
              - 'libs/migrations/src/postgres/odl/00018_knowledge_tables.ts'
              - 'libs/migrations/src/postgres/odl/00019_knowledge_files_description.ts'
              - 'libs/migrations/src/postgres/odl/00020_knowledge_search_hybrid.ts'
              - 'libs/migrations/src/postgres/odl/index.ts'

      - uses: pnpm/action-setup@v4
        if: steps.paths.outputs.knowledge == 'true'

      - uses: actions/setup-node@v4
        if: steps.paths.outputs.knowledge == 'true'
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        if: steps.paths.outputs.knowledge == 'true'
        run: pnpm install --frozen-lockfile

      - name: Unit tests (knowledge)
        if: steps.paths.outputs.knowledge == 'true'
        run: pnpm nx test knowledge && pnpm nx test knowledge-api

  query-api-unit:
    name: Query API — unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: paths
        with:
          filters: |
            query_api:
              - 'apps/query-api/**'
              - 'libs/currency/**'
              - 'libs/objects-domain/**'

      - uses: pnpm/action-setup@v4
        if: steps.paths.outputs.query_api == 'true'

      - uses: actions/setup-node@v4
        if: steps.paths.outputs.query_api == 'true'
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        if: steps.paths.outputs.query_api == 'true'
        run: pnpm install --frozen-lockfile

      - name: Unit tests (query-api)
        if: steps.paths.outputs.query_api == 'true'
        run: pnpm nx test query-api

  nest-typecheck:
    name: Nest apps + clients — TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: paths
        with:
          filters: |
            nest:
              - 'apps/auth-api/**'
              - 'apps/chain-indexer/**'
              - 'apps/query-api/**'
              - 'apps/knowledge-api/**'
              - 'apps/notifications/**'
              - 'apps/ipfs-gateway/**'
              - 'apps/scheduler/**'
              - 'apps/stack-watchdog/**'
              - 'libs/clients/**'
              - 'tsconfig.base.json'
              - 'package.json'
              - 'pnpm-lock.yaml'

      - uses: pnpm/action-setup@v4
        if: steps.paths.outputs.nest == 'true'

      - uses: actions/setup-node@v4
        if: steps.paths.outputs.nest == 'true'
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        if: steps.paths.outputs.nest == 'true'
        run: pnpm install --frozen-lockfile

      - name: Typecheck Nest apps + clients (tsc --noEmit)
        if: steps.paths.outputs.nest == 'true'
        run: pnpm typecheck:nest

  web-verify:
    name: Web — locale JSON UTF-8 + TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify apps/web locale catalogs (strict UTF-8, no BOM, valid JSON)
        run: node scripts/verify-web-locale-json-utf8.cjs

      - name: Typecheck apps/web (tsc --noEmit)
        run: pnpm nx run web:typecheck

  osv-scan-pr:
    name: OSV vulnerability scan (PR — new vulns only)
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.3.8
    with:
      scan-args: |-
        --config osv-scanner.toml
        --recursive
        ./

  osv-scan-push:
    name: OSV vulnerability scan (push — full)
    if: github.event_name == 'push'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.8
    with:
      scan-args: |-
        --config osv-scanner.toml
        --recursive
        ./
